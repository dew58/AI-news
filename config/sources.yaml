# ── LinkedIn RSS Bridges ──────────────────────────────────────────────────────
# LinkedIn has no public API. Use an RSS bridge like RSSHub (self-hosted or public).
# Format: "Name": "https://rsshub.app/linkedin/company/<company-slug>"
# Leave empty {} if not using LinkedIn.
linkedin_feeds:
  {}
  # OpenAI Company:   "https://rsshub.app/linkedin/company/openai"
  # Anthropic:        "https://rsshub.app/linkedin/company/anthropic"

# ── Collection Windows ────────────────────────────────────────────────────────
settings:
  rss_max_age_hours:   24    # Only include RSS articles from last N hours
  blog_max_age_hours:  72    # Blogs post less frequently, use wider window
  hn_top_stories:      30    # How many top HN stories to pull
  youtube_max_per_ch:  5     # Max videos per YouTube channel
