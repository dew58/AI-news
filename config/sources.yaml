# ─────────────────────────────────────────────────────────────────────────────
#  AI Daily News Digest — News Sources Configuration
#  Edit this file to add/remove/change any source without touching code.
# ─────────────────────────────────────────────────────────────────────────────

# ── RSS Feeds (Articles) ──────────────────────────────────────────────────────
rss_feeds:
  TechCrunch AI:       "https://techcrunch.com/category/artificial-intelligence/feed/"
  ArXiv CS.AI:         "https://rss.arxiv.org/rss/cs.AI"
  ArXiv CS.LG:         "https://rss.arxiv.org/rss/cs.LG"
  Wired:               "https://www.wired.com/feed/rss"
  MIT Tech Review:     "https://www.technologyreview.com/feed/"
  The Verge:           "https://www.theverge.com/rss/index.xml"
  VentureBeat AI:      "https://venturebeat.com/category/ai/feed/"
  Hacker News Blog:    "https://hnrss.org/frontpage"

# ── Official AI Company Blogs ─────────────────────────────────────────────────
# NOTE: Anthropic has no official RSS feed. We use a community RSSHub mirror.
blog_feeds:
  OpenAI:              "https://openai.com/news/rss.xml"
  Anthropic:           "https://rsshub.app/anthropic/news"  # community mirror via RSSHub
  Google DeepMind:     "https://deepmind.google/blog/rss.xml"
  Hugging Face:        "https://huggingface.co/blog/feed.xml"
  Mistral AI:          "https://mistral.ai/news/rss/"

